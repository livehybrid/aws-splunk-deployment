version: "0.1"

###############################################################################
# Infracost multi-project config — per-(layer × workspace) costing.
#
# Used by:
#   - Local: `make infracost-breakdown` or `make infracost-diff`
#   - CI:    .github/workflows/infracost.yml
#
# Each project is processed independently; the PR comment groups them by
# workspace so prod and dev totals are clearly separated. The account layer
# holds the persistent SmartStore/apps/KV-backup buckets + KMS; eks is the
# control plane + nodes. The sok layer adds only $0 IAM roles and needs the eks
# remote state to plan, so it is not costed standalone.
###############################################################################

projects:
  - path: terraform/layers/account
    name: account-prod
    terraform_var_files:
      - ../_shared/vars/prod.tfvars
    terraform_workspace: prod

  - path: terraform/layers/iam
    name: iam-prod
    terraform_var_files:
      - ../_shared/vars/prod.tfvars
    terraform_workspace: prod

  - path: terraform/layers/eks
    name: eks-prod
    terraform_var_files:
      - ../_shared/vars/prod.tfvars
    terraform_workspace: prod

  - path: terraform/layers/account
    name: account-dev
    terraform_var_files:
      - ../_shared/vars/dev.tfvars
    terraform_workspace: dev

  - path: terraform/layers/iam
    name: iam-dev
    terraform_var_files:
      - ../_shared/vars/dev.tfvars
    terraform_workspace: dev

  - path: terraform/layers/eks
    name: eks-dev
    terraform_var_files:
      - ../_shared/vars/dev.tfvars
    terraform_workspace: dev
