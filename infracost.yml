version: "0.1"

###############################################################################
# Infracost multi-project config — per-(layer × workspace) costing.
#
# Used by:
#   - Local: `make infracost-breakdown` or `make infracost-diff`
#   - CI:    .github/workflows/infracost.yml
#
# Each project is processed independently; the PR comment groups them by
# workspace so prod and dev totals are clearly separated.
###############################################################################

projects:
  - path: terraform/layers/account
    name: account-prod
    terraform_var_files:
      - ../_shared/vars/prod.tfvars
    terraform_workspace: prod

  - path: terraform/layers/iam
    name: iam-prod
    terraform_var_files:
      - ../_shared/vars/prod.tfvars
    terraform_workspace: prod

  - path: terraform/layers/cluster
    name: cluster-prod
    terraform_var_files:
      - ../_shared/vars/prod.tfvars
    terraform_workspace: prod

  - path: terraform/layers/account
    name: account-dev
    terraform_var_files:
      - ../_shared/vars/dev.tfvars
    terraform_workspace: dev

  - path: terraform/layers/iam
    name: iam-dev
    terraform_var_files:
      - ../_shared/vars/dev.tfvars
    terraform_workspace: dev

  - path: terraform/layers/cluster
    name: cluster-dev
    terraform_var_files:
      - ../_shared/vars/dev.tfvars
    terraform_workspace: dev

  # SOK path (deployment_model=sok). The sok layer itself adds only $0 IAM roles
  # and needs the eks remote state to plan, so it isn't costed standalone —
  # eks (control plane + nodes) + sok-foundation (S3/KMS) capture the SOK cost.
  - path: terraform/layers/sok-foundation
    name: sok-foundation-dev
    terraform_var_files:
      - ../_shared/vars/dev.tfvars
    terraform_workspace: dev

  - path: terraform/layers/eks
    name: eks-dev
    terraform_var_files:
      - ../_shared/vars/dev.tfvars
    terraform_workspace: dev

  # Prod SOK profile (staged behind deployment_model=ec2, but the eks/sok layer
  # sizing in prod.tfvars costs the same when the migration cuts over).
  - path: terraform/layers/sok-foundation
    name: sok-foundation-prod
    terraform_var_files:
      - ../_shared/vars/prod.tfvars
    terraform_workspace: prod

  - path: terraform/layers/eks
    name: eks-prod
    terraform_var_files:
      - ../_shared/vars/prod.tfvars
    terraform_workspace: prod
