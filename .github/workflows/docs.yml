# Build the MkDocs site and publish to GitHub Pages.
#
# While this repo is PRIVATE the workflow is manual-only: GitHub Pages on
# private repos is either unavailable (Free) or public-anyway (Pro),
# access-controlled Pages needs Enterprise Cloud. When the repo goes public:
#   1. Settings -> Pages -> Source = "GitHub Actions"
#   2. Uncomment the push trigger below.
name: docs
on:
  workflow_dispatch:
  # push:
  #   branches: [master]
  #   paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
