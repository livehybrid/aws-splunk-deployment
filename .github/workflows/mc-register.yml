###############################################################################
# MC REGISTER, (re)register every node as a Monitoring Console search peer
# (make mc-register). The MC's mc-register-peers.sh is run over SSM; it is
# idempotent housekeeping, normally run after a recycle when peer IPs change.
# Low risk: it only adds/refreshes search-peer entries on the MC.
#
# On-demand only. This targets the EC2 estate (SSM), so env is prod|dev to
# match the running workspace.
###############################################################################
name: MC REGISTER (re-register search peers)
run-name: MC REGISTER · ${{ inputs.env }}

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Workspace"
        type: choice
        options: [prod, dev]
        default: prod

permissions:
  id-token: write
  contents: read

concurrency: mc-register-${{ inputs.env }}

env:
  AWS_REGION: eu-west-2
  TARGET_ENV: ${{ inputs.env }}

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve AWS role
        env:
          ARN_VAR: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          ARN_SECRET: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
        run: |
          if [ -n "$ARN_VAR" ]; then echo "ROLE_ARN=$ARN_VAR" >> "$GITHUB_ENV"
          elif [ -n "$ARN_SECRET" ]; then echo "ROLE_ARN=$ARN_SECRET" >> "$GITHUB_ENV"
          else echo "::error ::AWS_TERRAFORM_ROLE_ARN is not set"; exit 1; fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: gha-mc-register-${{ github.run_id }}

      - name: MC register (make mc-register)
        shell: bash # pipefail
        run: |
          make mc-register env="$TARGET_ENV" | tee /tmp/mc-register.log
          echo "## MC register ($TARGET_ENV)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 /tmp/mc-register.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
