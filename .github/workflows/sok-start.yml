###############################################################################
# SOK START — bring up the eks + sok layers for a workspace (deployment_model
# = sok). Applies eks (cluster/nodes/storage/ALB) then sok (operator/CRDs/CRs).
#
# The sok-foundation layer (SmartStore + apps buckets) is PERSISTENT and assumed
# already applied — it is never part of this start/stop cycle.
#
# GitHub-hosted runners aren't in trusted_cidrs, so the runner's egress IP is
# passed to eks as eks_public_access_cidrs (appended to trusted_cidrs) — the
# same apply that creates the cluster then reaches the API to make the
# StorageClasses + ALB controller, and the sok apply reaches it for the CRs.
# The nightly SOK STOP removes the whole cluster, so there is no CIDR to clean.
###############################################################################
name: SOK START (bring up eks+sok)
# run-name embeds the env so the downstream "SOK CHECKS" workflow_run trigger can
# recover which workspace was started (workflow_run carries no dispatch inputs).
run-name: SOK START · ${{ inputs.env || 'dev' }}

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Workspace to start"
        type: choice
        options: [dev, prod]
        default: dev
      overlay:
        description: "Optional shape overlay from vars/overlays/ (e.g. dev-multisite)"
        type: string
        default: ""
      confirm:
        description: "Type the env name to confirm a PROD start (ignored for dev)"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read
  actions: write # dispatch SOK CHECKS explicitly (workflow_run proved unreliable)

concurrency: splunk-power-${{ inputs.env }}

env:
  AWS_REGION: eu-west-2
  TF_VERSION: "1.11.1"
  TARGET_ENV: ${{ inputs.env || 'dev' }}
  OVERLAY: ${{ inputs.overlay || '' }}

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Prod confirmation gate + overlay check
        run: |
          # DEP-5: a prod dispatch must be deliberate — require confirm=prod.
          if [ "$TARGET_ENV" = "prod" ] && [ "${{ inputs.confirm }}" != "prod" ]; then
            echo "::error ::refusing to start PROD without confirm=prod"; exit 1; fi
          # Overlay must exist before we burn 10 minutes of applies.
          if [ -n "$OVERLAY" ] && [ ! -f "terraform/layers/_shared/vars/overlays/$OVERLAY.tfvars" ]; then
            echo "::error ::overlay vars/overlays/$OVERLAY.tfvars not found"; exit 1; fi
          echo "OVERLAY_ARGS=${OVERLAY:+-var-file=vars/overlays/$OVERLAY.tfvars}" >> "$GITHUB_ENV"

      - name: Resolve AWS role
        env:
          ARN_VAR: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          ARN_SECRET: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
        run: |
          if [ -n "$ARN_VAR" ]; then echo "ROLE_ARN=$ARN_VAR" >> "$GITHUB_ENV"
          elif [ -n "$ARN_SECRET" ]; then echo "ROLE_ARN=$ARN_SECRET" >> "$GITHUB_ENV"
          else echo "::error ::AWS_TERRAFORM_ROLE_ARN is not set"; exit 1; fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: gha-sok-start-${{ github.run_id }}

      - name: Write OIDC creds into the default profile
        run: |
          aws configure set aws_access_key_id     "$AWS_ACCESS_KEY_ID"     --profile default
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile default
          aws configure set aws_session_token     "$AWS_SESSION_TOKEN"     --profile default
          aws configure set region                "$AWS_REGION"            --profile default

      - name: Runner egress IP
        run: echo "RUNNER_CIDR=$(curl -s https://checkip.amazonaws.com)/32" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Apply eks (cluster + nodes + storage + ALB)
        working-directory: terraform/layers/eks
        run: |
          terraform init -input=false -backend-config=conf/$TARGET_ENV.backend.conf
          terraform workspace select -or-create $TARGET_ENV
          terraform apply -input=false -auto-approve -lock-timeout=5m \
            -var-file=vars/$TARGET_ENV.tfvars $OVERLAY_ARGS \
            -var "eks_public_access_cidrs=[\"$RUNNER_CIDR\"]"

      - name: Apply sok (operator + CRDs + CRs)
        working-directory: terraform/layers/sok
        run: |
          # The web-ingress DNS waiter (scripts/sok-web-dns.sh, a local-exec
          # provisioner) polls the Ingress with RAW kubectl — unlike the layer's
          # providers it reads ~/.kube/config, so the kubeconfig must exist
          # BEFORE this apply or the provisioner times out and fails the start.
          aws eks update-kubeconfig --name splunk-sok-$TARGET_ENV --region "$AWS_REGION"
          terraform init -input=false -backend-config=conf/$TARGET_ENV.backend.conf
          terraform workspace select -or-create $TARGET_ENV
          terraform apply -input=false -auto-approve -lock-timeout=5m \
            -var-file=vars/$TARGET_ENV.tfvars $OVERLAY_ARGS

      - name: Drift check (post-apply plans must be empty)
        run: |
          # DEP-11: the stop/start model assumes a deterministic rebuild — a
          # non-empty plan straight after apply means config/reality drift
          # (flapping data source, out-of-band edit, floating version). Warn,
          # don't fail: the cluster is up and CHECKS validates health.
          for layer in eks sok; do
            ( cd terraform/layers/$layer
              terraform plan -input=false -lock-timeout=5m -detailed-exitcode \
                -var-file=vars/$TARGET_ENV.tfvars $OVERLAY_ARGS \
                $( [ "$layer" = eks ] && printf '%s' "-var eks_public_access_cidrs=[\"$RUNNER_CIDR\"]" ) \
                >/dev/null 2>&1 )
            rc=$?
            case $rc in
              0) echo "$layer: no drift" ;;
              2) echo "::warning ::$layer plan is NOT empty immediately after apply — investigate drift" ;;
              *) echo "::warning ::$layer drift-check plan errored (rc=$rc)" ;;
            esac
          done

      - name: Summary
        run: |
          aws eks update-kubeconfig --name splunk-sok-$TARGET_ENV --region "$AWS_REGION"
          echo "## SOK $TARGET_ENV started" >> "$GITHUB_STEP_SUMMARY"
          kubectl get clustermanager,indexercluster,standalone,licensemanager,monitoringconsole -n splunk >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: Dispatch SOK CHECKS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # #54: the workflow_run trigger on sok-checks.yml never fired after the
          # first prod START (event undelivered; registered+active, both files on
          # master). Dispatch explicitly with the env input — deterministic and
          # self-documenting; workflow_run stays as a belt-and-braces backup.
          gh workflow run "SOK CHECKS (health)" --repo "$GITHUB_REPOSITORY" -f env="$TARGET_ENV" \
            || echo "::warning ::could not dispatch SOK CHECKS — run it manually (env=$TARGET_ENV)"

      - name: Notify Slack on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # OPS-4: lifecycle failures must not rely on someone reading the Actions
          # tab. No-op until the SLACK_WEBHOOK_URL secret is set.
          [ -z "$WEBHOOK" ] && { echo "SLACK_WEBHOOK_URL not set — skipping notify"; exit 0; }
          curl -s -m 10 -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":rotating_light: *${{ github.workflow }}* failed for \`$TARGET_ENV\` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$WEBHOOK" || true
