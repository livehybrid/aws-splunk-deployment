###############################################################################
# Splunk DEPLOY APPS — sync the splunk-apps repo onto the running CM and
# Deployer (via SSM) and push the cluster + SHC bundles.
#
# Manual dispatch with env + scope. To auto-deploy on every merge to the
# splunk-apps repo, add a workflow THERE that fires a repository_dispatch
# (or `gh workflow run`) at this one using a fine-grained PAT/app token.
###############################################################################
name: Splunk DEPLOY APPS

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Workspace"
        type: choice
        options: [prod, dev]
        default: prod
      scope:
        description: "Which tier: idx=cluster bundle, shc=SHC bundle, ds=deployment-server reload, cm=CM's own apps (restart), all=idx+shc+ds"
        type: choice
        options: [all, idx, shc, ds, cm]
        default: all

permissions:
  id-token: write
  contents: read

concurrency: splunk-deploy-${{ inputs.env }}

env:
  AWS_REGION: eu-west-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve AWS role
        env:
          ARN_VAR: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          ARN_SECRET: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
        run: |
          if [ -n "$ARN_VAR" ]; then
            echo "ROLE_ARN=$ARN_VAR" >> "$GITHUB_ENV"
          elif [ -n "$ARN_SECRET" ]; then
            echo "ROLE_ARN=$ARN_SECRET" >> "$GITHUB_ENV"
          else
            echo "::error ::AWS_TERRAFORM_ROLE_ARN is not set."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: github-actions-splunk-deploy-${{ github.run_id }}

      - name: Deploy apps
        shell: bash # pipefail
        run: |
          ./scripts/deploy-apps.sh "${{ inputs.env }}" "${{ inputs.scope }}" | tee /tmp/deploy.log
          echo "## Deploy apps (${{ inputs.env }}, ${{ inputs.scope }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 /tmp/deploy.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
